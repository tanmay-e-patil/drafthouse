services:
  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 512M --developer-mode 1
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh $(hostname -i | awk '{print $1}') 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
  migrate-pg:
    image: ghcr.io/tanmay-e-patil/drafthouse:latest
    entrypoint: ["/app/migrate-pg"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the existing Postgres database}
      MIGRATIONS_DIR: /app/migrations/postgres
    networks:
      - postgres
    restart: "no"

  migrate-scylla:
    image: ghcr.io/tanmay-e-patil/drafthouse:latest
    entrypoint: ["/app/migrate-scylla"]
    environment:
      SCYLLA_NODES: scylla:9042
      SCYLLA_KEYSPACE: drafthouse
      SCYLLA_MIGRATIONS_DIR: /app/migrations/scylla
    depends_on:
      scylla:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/tanmay-e-patil/drafthouse:latest
    pull_policy: always
    expose:
      - "8080"
    networks:
      - default
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the existing Postgres database}
      SCYLLA_NODES: scylla:9042
      SCYLLA_KEYSPACE: drafthouse
      BIND_ADDR: 0.0.0.0:8080
      APP_ORIGIN: ${APP_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      migrate-pg:
        condition: service_completed_successfully
      migrate-scylla:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  scylla_data:

networks:
  default:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK to the existing database network}
